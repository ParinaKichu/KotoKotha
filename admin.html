<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin — KotoKotha</title>
    <script>(function(){var t=localStorage.getItem('kotokotha_theme');if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)})()</script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="admin">

    <header>
        <div class="container">
            <a href="index.html" class="logo">কতকথা KotoKotha</a>
            <nav class="nav-links" id="navLinks">
                <a href="index.html">View Site</a>
            </nav>
            <div class="header-actions">
                <button class="btn btn-secondary btn-sm" id="logoutBtn" hidden>Log out</button>
                <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode">🌙</button>
                <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
            </div>
        </div>
    </header>

    <main>
        <div class="container">

            <!-- ═══ LOGIN ═══ -->
            <section id="loginView" class="admin-login" hidden>
                <h1 class="section-title">Admin Login</h1>
                <div id="loginMessage"></div>
                <form id="loginForm" class="card">
                    <div class="form-group">
                        <label for="adminEmail">Email</label>
                        <input type="email" id="adminEmail" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="adminPassword">Password</label>
                        <input type="password" id="adminPassword" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary" id="loginBtn">Log in</button>
                </form>
            </section>

            <!-- ═══ DASHBOARD ═══ -->
            <section id="dashView" hidden>
                <h1 class="section-title">Moderation</h1>
                <div id="adminMessage"></div>

                <div class="admin-toolbar">
                    <div class="tabs" id="tabs">
                        <button class="tab active" data-tab="pending">Pending <span id="countPending">0</span></button>
                        <button class="tab" data-tab="live">Live <span id="countLive">0</span></button>
                        <button class="tab" data-tab="all">All <span id="countAll">0</span></button>
                    </div>
                    <div class="admin-search">
                        <input type="text" id="adminSearch" placeholder="Search title, institution, text…">
                        <button class="btn btn-secondary btn-sm" id="refreshBtn">Refresh</button>
                    </div>
                </div>

                <div class="admin-list" id="adminList"></div>
            </section>

        </div>
    </main>

    <!-- ═══ EDIT MODAL ═══ -->
    <div class="modal-backdrop" id="editModal" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editHeading">
            <h2 id="editHeading">Edit post</h2>
            <div id="editMessage"></div>
            <form id="editForm">
                <div class="form-group">
                    <label for="editTitle">Title</label>
                    <input type="text" id="editTitle" required>
                </div>
                <div class="form-group">
                    <label for="editCategory">Category</label>
                    <select id="editCategory"></select>
                </div>
                <div class="form-group">
                    <label for="editInstitution">Institution</label>
                    <input type="text" id="editInstitution" required>
                </div>
                <div class="form-group">
                    <label for="editDivision">Division</label>
                    <select id="editDivision"></select>
                </div>
                <div class="form-group">
                    <label for="editDistrict">District</label>
                    <select id="editDistrict"></select>
                </div>
                <div class="form-group">
                    <label for="editRating">Rating</label>
                    <select id="editRating">
                        <option value="1">1 ★</option>
                        <option value="2">2 ★★</option>
                        <option value="3">3 ★★★</option>
                        <option value="4">4 ★★★★</option>
                        <option value="5">5 ★★★★★</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editBody">Experience</label>
                    <textarea id="editBody" rows="8" required></textarea>
                    <small>Remove names, phone numbers or other personal details before approving.</small>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="editCancel">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="editSave">Save changes</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <p class="footer-disclaimer" id="footerDisclaimer"></p>
            <div class="footer-bottom">
                <p>KotoKotha — Share your experience anonymously</p>
                <div class="footer-links">
                    <a href="about.html">About</a>
                    <a href="privacy.html">Privacy</a>
                    <a href="terms.html">Terms</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/locations.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
